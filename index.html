<!DOCTYPE html>
<html>
<head>
  <title>🌙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Premium Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #f8cdda, #fbd3e9);
      overflow: hidden;
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 30px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: #2d2d2d;
      letter-spacing: 1px;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.7;
      max-width: 320px;
      margin: auto;
    }

    img {
      width: 260px;
      border-radius: 20px;
      margin-top: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      transition: 0.6s;
    }

    .btn {
      margin-top: 25px;
      padding: 10px 28px;
      background: #ff7aa2;
      color: white;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff5c8a;
    }

    /* Floating aesthetic elements */
    .float {
      position: fixed;
      bottom: -10px;
      font-size: 18px;
      animation: floatUp linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      from { transform: translateY(0); }
      to { transform: translateY(-110vh); }
    }

    /* Smooth fade */
    .fade {
      animation: fade 0.6s;
    }

    @keyframes fade {
      from {opacity: 0.2;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Hey 🌙</h1>

  <p>
    Not everything we notice has a reason.<br>
    Some things just stay… quietly ✨
  </p>

  <img id="pic" src="https://i.ibb.co/m533FYJW/1.jpg">

  <p id="text">
    There’s a stillness in the way you exist 🌿
  </p>

  <button class="btn" onclick="next()">Next →</button>
</div>

<script>
  let images = [
    "https://i.ibb.co/m533FYJW/1.jpg",
    "https://i.ibb.co/xcLWM8B/2.jpg",
    "https://i.ibb.co/G4B28BwG/3.jpg",
    "https://i.ibb.co/QvS0131d/4.jpg",
    "https://i.ibb.co/B57Z5HZJ/5.jpg",
    "https://i.ibb.co/m5kZZNnC/6.jpg"
  ];

  let texts = [
    "There’s a stillness in the way you exist 🌿",
    "Some people don’t try to be seen… yet they are 🌙",
    "You feel like a quiet moment in a loud world ☁️",
    "Not everything beautiful needs attention ✨",
    "There’s something effortless about your presence 🌸",
    "Some impressions don’t fade… they just stay 💫"
  ];

  let i = 0;

  function next() {
    i = (i + 1) % images.length;

    let img = document.getElementById("pic");
    let txt = document.getElementById("text");

    img.classList.remove("fade");
    void img.offsetWidth;
    img.classList.add("fade");

    img.src = images[i];
    txt.innerText = texts[i];
  }

  // Floating elements
  function createFloat() {
    let el = document.createElement("div");
    el.classList.add("float");

    let items = ["✨","🌙","💫","🌸","☁️"];
    el.innerText = items[Math.floor(Math.random()*items.length)];

    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (6 + Math.random()*6) + "s";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 12000);
  }

  setInterval(createFloat, 800);
</script>

</body>
</html>
