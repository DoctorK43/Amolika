<!DOCTYPE html>
<html>
<head>
  <title>🙂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #f8cdda, #fbd3e9);
      overflow: hidden;
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 30px;
    }

    h1 {
      font-weight: 500;
      color: #333;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    img {
      width: 260px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      transition: 0.5s;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 25px;
      background: #ff7aa2;
      color: white;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff5c8a;
    }

    /* Floating elements */
    .float {
      position: fixed;
      bottom: -10px;
      font-size: 20px;
      animation: floatUp linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      from { transform: translateY(0); }
      to { transform: translateY(-110vh); }
    }

    /* Fade animation */
    .fade {
      animation: fade 0.6s;
    }

    @keyframes fade {
      from {opacity: 0.3;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Hey 🌙</h1>
  <p>
    Sometimes… you notice people without a reason.<br>
    Not loudly, not all at once—<br>
    just in small, quiet moments ✨
  </p>

  <img id="pic" src="https://i.ibb.co/m533FYJW/1.jpg">

  <p id="text">
    There’s a kind of calm in the way you exist 🌿
  </p>

  <button class="btn" onclick="next()">Next →</button>
</div>

<script>
  let images = [
    "https://i.ibb.co/m533FYJW/1.jpg",
    "https://i.ibb.co/xcLWM8B/2.jpg",
    "https://i.ibb.co/G4B28BwG/3.jpg",
    "https://i.ibb.co/QvS0131d/4.jpg",
    "https://i.ibb.co/B57Z5HZJ/5.jpg",
    "https://i.ibb.co/m5kZZNnC/6.jpg"
  ];

  let texts = [
    "There’s a kind of calm in the way you exist 🌿",
    "Some smiles don’t try hard… they just feel real 🌼",
    "You seem like someone who makes ordinary moments softer ☁️",
    "There’s a quiet confidence in you… not loud, just steady 🌙",
    "Not everything needs to be said—some things are just felt ✨",
    "You have a presence that doesn’t ask for attention, yet it stays 🌸"
  ];

  let i = 0;

  function next() {
    i = (i + 1) % images.length;

    let img = document.getElementById("pic");
    let txt = document.getElementById("text");

    img.classList.remove("fade");
    void img.offsetWidth;
    img.classList.add("fade");

    img.src = images[i];
    txt.innerText = texts[i];
  }

  // Auto change every 5 sec
  setInterval(next, 5000);

  // Floating aesthetic elements
  function createFloat() {
    let el = document.createElement("div");
    el.classList.add("float");

    let items = ["✨","🌙","💫","🌸","☁️"];
    el.innerText = items[Math.floor(Math.random()*items.length)];

    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (6 + Math.random()*6) + "s";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 12000);
  }

  setInterval(createFloat, 700);
</script>

</body>
</html>
